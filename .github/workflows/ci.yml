name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # 1. FRONTEND CI: Linting & Production Build Verification
  # =========================================================
  frontend-ci:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vite Production Build
        run: npm run build

  # =========================================================
  # 2. BACKEND CI: Schema Validation & Client Generation
  # =========================================================
  backend-ci:
    name: Backend (Prisma & Syntax)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "postgresql://ci_user:ci_pass@localhost:5432/ci_db?schema=public"
      JWT_SECRET: "ci_jwt_secret_for_schema_and_code_validation_only"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema Syntax & Relations
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify Server Entrypoint Syntax
        run: node --check src/server.js
